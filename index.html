<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spanish Verb Conjugation Practice</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #222;
  }

  .container {
    width: min(90%, 600px);
    margin: 0 auto;
    padding: 40px 0 60px;
  }

  h1 {
    margin: 0 0 35px;
    text-align: center;
    font-size: 26px;
  }

  .selector-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #666;
  }

  select {
    width: 100%;
    padding: 13px 14px;
    font-size: 17px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
    cursor: pointer;
  }

  .question-card {
    margin-top: 70px;
    text-align: center;
  }

  .verb {
    min-height: 45px;
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 18px;
  }

  .question {
    min-height: 35px;
    font-size: 22px;
    margin-bottom: 45px;
  }

  .answer-box {
      min-height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;

      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
  }


  .hint {
    color: #666;
  }

  .answer {
    font-size: 34px;
    font-weight: bold;
  }

  .hidden {
    display: none;
  }

  .next-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #222;
    color: white;
  }

  .next-button:hover {
    background: #444;
  }

  @media (max-width: 500px) {
    .container {
      width: min(90%, 600px);
      padding-top: 30px;
    }

    .question-card {
      margin-top: 70px;
      text-align: center;

      padding: 45px 30px 30px;
      border: 1px solid #ddd;
      border-radius: 14px;
    }

    .verb {
      font-size: 30px;
    }

    .question {
      font-size: 20px;
    }
}
</style>

      


</head>

<body>

  <main class="container">

    <h1>Spanish Verb Practice</h1>

    <label class="selector-label" for="verbSelect">
      Choose verbs
    </label>

    <select id="verbSelect">
      <option value="random">Random</option>
      <option value="estar">estar</option>
      <option value="ser">ser</option>
      <option value="tener">tener</option>
      <option value="haber">haber</option>
      <option value="hacer">hacer</option>
      <option value="poder">poder</option>
      <option value="decir">decir</option>
      <option value="ir">ir</option>
      <option value="dar">dar</option>
      <option value="hablar">hablar</option>
      <option value="comer">comer</option>
      <option value="vivir">vivir</option>
    </select>


    <section class="question-card">

      <div class="verb" id="verbDisplay"></div>

      <div class="question" id="questionDisplay"></div>

      <div class="answer-box" id="answerBox">
        <span class="hint" id="clickText">
          Show the answer
        </span>

        <span class="answer hidden" id="answerDisplay"></span>
      </div>

      <button class="next-button hidden" id="nextButton">
        Next
      </button>

    </section>

  </main>


  <script src="verbs.js"></script>

</body>
</html>
