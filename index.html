<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spanish Verb Conjugation Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
    }

    .container {
      width: min(90%, 600px);
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .selector-label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .question-card {
      margin-top: 35px;
      text-align: center;
    }

    .verb {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .question {
      font-size: 24px;
      margin-bottom: 25px;
    }

    .answer-box {
      min-height: 100px;
      padding: 25px;
      border: 2px dashed #bbb;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      user-select: none;
      transition: 0.2s;
    }

    .answer-box:hover {
      background: #fafafa;
      border-color: #777;
    }

    .answer {
      font-size: 30px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .next-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    .next-button:hover {
      background: #444;
    }

    .hint {
      color: #777;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Spanish Verb Practice</h1>

    <label class="selector-label" for="verbSelect">
      Choose verbs
    </label>

    <select id="verbSelect">
      <option value="random">Random</option>
      <option value="estar">estar</option>
      <option value="ser">ser</option>
      <option value="tener">tener</option>
      <option value="haber">haber</option>
      <option value="hacer">hacer</option>
      <option value="poder">poder</option>
      <option value="decir">decir</option>
      <option value="ir">ir</option>
      <option value="dar">dar</option>
      <option value="hablar">hablar</option>
      <option value="comer">comer</option>
      <option value="vivir">vivir</option>
    </select>


    <section class="question-card">

      <div class="verb" id="verbDisplay"></div>

      <div class="question" id="questionDisplay"></div>

      <div class="answer-box" id="answerBox">
        <span class="hint" id="clickText">
          Show the answer
        </span>

        <span class="answer hidden" id="answerDisplay"></span>
      </div>

      <button class="next-button hidden" id="nextButton">
        Next
      </button>

    </section>

  </main>


  <script src="verbs.js"></script>

</body>
</html>
